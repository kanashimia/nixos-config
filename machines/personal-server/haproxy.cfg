backend website from http
  http-request use-service lua.magic8ball if { path /magic }
  http-request set-var(req.redirect_url) path,field(-1,/),map(opt@redirect.map) if { path_beg /short/ }
  http-request redirect location %[var(req.redirect_url)] code 307 if { var(req.redirect_url) -m found }
  # http-send-name-header Host
  server s1 caddy.internal:8000 alpn http/1.1 check
  http-response deny deny_status 404 if { status 404 }

backend vault from http
  option httpchk GET /api/alive
  acl is_admin_path path_beg -i /admin
  http-request redirect location "/" if is_admin_path
  http-response set-header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' https://api.pwnedpasswords.com"
  http-response set-header Connection-Allowlist '(response-origin "https://api.pwnedpasswords.com")'
  server s1 vaultwarden.internal:8000 alpn http/1.1 check

backend headscale from http
  # option httpchk GET /health
  server s1 headscale.internal:8000 alpn http/1.1 check
  http-response deny deny_status 404 if { status 404 }

backend error from http
  # http-request deny deny_status 404
  http-request deny status 418 content-type text/html string "<html><body><h1>418 I'm a teapot</h1>Refusing to brew coffee because server is, permanently, a teapot</body></html>"
