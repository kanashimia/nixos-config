global
  maxconn 40000
  stats socket /run/haproxy/haproxy.sock mode 600 expose-fd listeners level admin
  expose-experimental-directives
  httpclient.resolvers.prefer ipv4
  httpclient.ssl.ca-file /etc/pki/tls/certs/ca-bundle.crt

  log stderr format short daemon
  # log /dev/log local0

  tune.lua.bool-sample-conversion normal
  tune.lua.openlibs string,math,table,utf8
  lua-load-per-thread trisdemo.lua
  lua-load-per-thread magic8ball.lua

  ssl-default-bind-curves MLKEM1024:MLKEM768:MLKEM512:X25519MLKEM768:X25519:P-256:P-384 # pure PQ lmao, also losers curves bleegh
  ssl-default-bind-options prefer-client-ciphers ssl-min-ver TLSv1.3 no-tls-tickets
  ssl-default-server-options ssl-min-ver TLSv1.3 no-tls-tickets # no use case for TLS 1.2

  tune.h2.fe.max-rst-at-once 1
  tune.h2.fe.glitches-threshold 200

  maxcompcpuusage 70

  chroot auto

  # ssl-default-bind-sigalgs ECDSA+SHA256:ECDSA+SHA384:ECDSA+SHA512
  # ssl-default-bind-curves MLKEM1024:MLKEM768:MLKEM512:X25519MLKEM768:X25519:P-256:P-384
  # ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
  # ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  # ssl-default-bind-options prefer-client-ciphers ssl-min-ver TLSv1.2 no-tls-tickets

  # ssl-default-server-sigalgs ECDSA+SHA256:ECDSA+SHA384:ECDSA+SHA512
  # ssl-default-server-curves X25519MLKEM768:X25519:P-256:P-384
  # ssl-default-server-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
  # ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  # ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults base
  log global
  option dontlognull

  timeout client 60s
  timeout server 60s
  timeout connect 10s
  timeout tarpit 60s
  timeout queue 15s

  timeout http-request 15s # slowloris protection
  timeout http-keep-alive 2m # honestly I have no idea what value to use

  timeout tunnel 1h # for websocket
  timeout client-fin 1s
  timeout server-fin 1s

defaults http from base
  mode http
  # option httplog
  # option httpslog
  log-format "%ci:%cp %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs \"%[method] %HP %HV\" %[fc_err]/%[ssl_fc_err,hex]/%[ssl_c_err]/%[ssl_c_ca_err]/%[ssl_fc_is_resumed] %[ssl_fc_sni]/%sslv/%sslc"
  # log-format "%ci:%cp %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r"
  # log-format "%ci:%cp %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq %hr %hs %{+Q}r %[fc_err]/%[ssl_fc_err,hex]/%[ssl_c_err]/%[ssl_c_ca_err]/%[ssl_fc_is_resumed] %[ssl_fc_sni]/%sslv/%sslc"


defaults tcp from base
  mode tcp
  option tcplog

defaults http_cloudflare from http
  acl is_cloudflare src -f /var/lib/haproxy/cloudflare-ips.lst
  http-request set-src hdr(CF-Connecting-IP) if is_cloudflare
  http-request set-header X-Forwarded-For %[src]
  http-request set-header X-Real-IP %[src]

acme letsencrypt-http-shortlived
  directory https://acme-v02.api.letsencrypt.org/directory
  # directory https://acme-staging-v02.api.letsencrypt.org/directory
  contact acme-ha@redpilled.dev
  challenge http-01
  keytype ECDSA
  curves P-256
  profile shortlived
  map virt@acme-letsencrypt-http-shortlived

acme letsencrypt-dns
  directory https://acme-v02.api.letsencrypt.org/directory
  contact acme-ha@redpilled.dev
  challenge dns-01
  keytype ECDSA
  curves P-256

crt-store cert
  # crt-base /var/lib/haproxy
  # key-base /var/lib/haproxy
  # load crt "redpilled.dev.pem" acme "letsencrypt-staging" domains "test.redpilled.dev" alias "test"
  load crt "redpilled.dev.pem" acme "letsencrypt-dns" domains "redpilled.dev,*.redpilled.dev,*.ts.redpilled.dev" alias "main"

cache memcache
  total-max-size 256 # megabytes
  max-object-size 20971520 # bytes
  max-age 240 # seconds
  process-vary on
  max-secondary-entries 12

# map one TCP port to each game
# .notice 'use "socat TCP-CONNECT:redpilled.dev:1337 STDIO,raw,echo=0" to start playing'
frontend trisdemo from tcp
  bind :1337
  tcp-request content use-service lua.trisdemo

frontend prometheus from http
  no log
  bind :8405
  http-request use-service prometheus-exporter

frontend www from http_cloudflare
  # bind [::]:80
  # bind [::]:443 ssl # allow-0rtt
  # bind quic6@[::]:443 ssl # allow-0rtt

  bind [::]:80,:80 v6only
  bind [::]:443,:443 v6only ssl # allow-0rtt
  bind quic6@[::]:443,quic4@:443 v6only ssl # allow-0rtt

  # ssl-f-use crt "@cert/main" ca-file ca/ca-root.crt verify optional
  ssl-f-use crt "@cert/main"

  # Security Stick-Table
  # A single unified table tracking client burst rates and protocol anomalies simultaneously
  stick-table type ip size 1m expire 5m store http_req_rate(10s),glitch_cnt

  # EARLY DROP LAYER: Track and evaluate clients at the raw network layer.
  # This catches abusive clients BEFORE they can waste CPU cycles on TLS handshakes.
  # Initialize tracking slot 'sc0' for the incoming source IP
  tcp-request connection track-sc0 src

  # Defensive Action A: Catch Persistent Protocol Glitchers / Window Stalls
  # Instantly drop the raw socket if an IP accumulates more than 1000 cumulative glitches.
  tcp-request connection reject if { sc0_glitch_cnt gt 1000 }

  # Defensive Action B: Catch Volumetric Request Floods
  # Instantly drop the raw socket if a client exceeds clean request burst limits.
  tcp-request connection reject if { sc0_http_req_rate gt 200 }

  # http-request return status 200 content-type text/plain lf-string "%[path,field(-1,/)].%[path,field(-1,/),map(virt@acme-letsencrypt-http-shortlived)]\n" if { path_beg '/.well-known/acme-challenge/' }

  http-request return status 200 content-type text/plain lf-string "%[path,field(-1,/)].%[path,field(-1,/),map(virt@acme-letsencrypt-http-shortlived)]" if { path_beg '/.well-known/acme-challenge/' } { path,field(-1,/),map(virt@acme-letsencrypt-http-shortlived) -m found }

  # http-request set-var(req.acme_challenge_token) path,field(-1,/) if { path_beg '/.well-known/acme-challenge/' }
  # http-request set-var(req.acme_auth_fingerprint,ifnotempty) var(req.acme_account),map(virt@acme-letsencrypt-http-shortlived)
  # http-request return status 200 content-type text/plain lf-string "%[var(req.acme_challenge_token)].%[var(req.acme_auth_fingerprint)]\n" if { var(req.acme_auth_fingerprint) -m found }

  filter cache memcache
  filter comp-res

  compression algo-res gzip
  compression type text/html text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm application/svg+xml application/font-sfnt font/woff
  compression minsize-res 512

  http-request cache-use memcache
  http-response cache-store memcache

  http-response set-header X-Cache-Status %[res.cache_hit,iif(HIT,MISS)]

  http-request tarpit deny_status 404 if { path_end .php } # no bad languages are allowed

  http-request set-header Host %[hdr(host),host_only,lower] # remove port from host header

  http-request normalize-uri fragment-strip
  http-request normalize-uri path-merge-slashes
  http-request normalize-uri path-strip-dot
  http-request normalize-uri path-strip-dotdot full

  # acl safe_0rtt_method method GET HEADER CONNECT OPTIONS TRACE
  # http-request wait-for-handshake if { ssl_fc_has_early } !safe_0rtt_method # 0rtt is only for meth lovers

  # http-request deny deny_status 425 if { ssl_fc_has_early } !safe_0rtt_method

  # http-after-response add-header alt-svc 'h3=":443"; ma=60'
  # http-response set-header "alt-svc" 'h3=":443"; ma=86400, h2=":443"; ma=86400'
  
  http-request capture req.hdr(host) len 256
  # http-request set-var(txn.http_ver) req.ver
  # http-after-response add-header Via "%[var(txn.http_ver)] ha1"
  http-after-response add-header Via "%HV ha1"

  # acl is_valid_client_cert ssl_c_used && !ssl_c_verify
  # http-request redirect code 307 location https://%[hdr(host),host_only]%[capture.req.uri] if { dst_port eq 1338 }
  # http-request deny content-type text/plain lf-string "%[src_port] %[fc_src_port] %[dst_port] " if !is_valid_client_cert { path_beg /test }

  # http-after-response set-header Strict-Transport-Security "max-age=31536000"
  # http-request redirect code 301 scheme https if !{ ssl_fc } !{ path_beg /.well-known/acme-challenge/ }

  http-request redirect code 301 prefix https://redpilled.dev code 301 if { hdr(host) www.redpilled.dev }

  # acl is_mail_dom hdr(host) mail.redpilled.dev mta-sts.redpilled.dev autoconfig.redpilled.dev autodiscover.redpilled.dev
  # acl is_mail_path path_beg /jmap /auth /healthz
  # acl is_mail_path path_beg /.well-known/oauth-authorization-server /.well-known/openid-configuration /.well-known/jmap
  # use_backend mail if is_mail_dom || { hdr(host) redpilled.dev } is_mail_path

  # acl is_stats_path path_beg /haproxy/stats
  # use_backend stats if { hdr(host) redpilled.dev } is_stats_path

  # use_backend vault if { hdr(host) vault.redpilled.dev }
  # use_backend headscale if { hdr(host) headscale.redpilled.dev }
  # use_backend website if { hdr(host) redpilled.dev }

  use_backend %[base,rtrim(/),concat(/),map_beg(routes.map)]

  # use_backend %[base,concat(,,/),map_beg(routes.map)] if ! { base_end / }
  # use_backend %[base,map_beg(routes.map)]

  # http-request deny status 418 content-type text/html string "test"

  default_backend error

backend stats from http
  acl is_stats_allowed_ips src -f stats-allowed-ips.lst
  http-request deny deny_status 404 if !is_stats_allowed_ips

  stats enable
  # stats hide-version
  stats uri /haproxy/stats
  stats refresh 10s
  # stats admin if LOCALHOST

