backend mail from http
  option httpchk GET /healthz/ready
  # server s1 stalwart.internal:10080 send-proxy-v2 check
  server s1 localhost:10080 send-proxy-v2 check
  acl is_static_asset res.hdr(content-type) text/css application/javascript application/wasm image/png image/x-icon
  http-response set-header Cache-Control "public, max-age=5184000, immutable" if is_static_asset
  # http-response deny deny_status 404 if { status 404 }

