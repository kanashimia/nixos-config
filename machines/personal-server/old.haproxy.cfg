backend website from http
  guid b-website
  compression algo gzip
  compression type text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript

  # http-send-name-header Host
  server s1 caddy.internal:8000 alpn http/1.1 guid b-website-s1
  http-response deny deny_status 404 if { status 404 }

backend vault from http
  guid b-vault
  compression algo gzip
  compression type text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript

  acl is_admin_path path_beg -i /admin
  http-request redirect location "/" if is_admin_path

  server s1 vaultwarden.internal:8000 alpn http/1.1 guid b-vault-s1

backend headscale from http
  guid b-headscale
  server s1 headscale.internal:8000 alpn http/1.1 guid b-headscale-s1
  http-response deny deny_status 404 if { status 404 }

backend error from http
  guid b-error
  # http-request return status 418 content-type "text/plain" lf-string "ERR not FOUND" 
  http-request deny deny_status 404
